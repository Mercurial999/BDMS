name: bdms

services:
  db:
    image: postgres:18
    container_name: bdms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bdms_db
    ports:
      - "5433:5432"
    volumes:
      - bdms-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./server
    container_name: bdms-backend-compose
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bdms_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: bdms-frontend-compose
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  bdms-postgres-data:
    external: true
